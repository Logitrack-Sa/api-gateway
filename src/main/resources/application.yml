server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  profiles:
    default: dev
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
management:
  endpoints.web.exposure.include: health
  endpoint:
    health:
      show-details: never
      show-components: never
    gateway.access: none
logging.level.com.logitrack: INFO
